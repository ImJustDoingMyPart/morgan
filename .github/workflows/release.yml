# En cada etiqueta vX.Y.Z: compila morgan en Arch y publica el release con el tarball que
# baja el paquete morgan-bin (dist/arch/morgan-bin/PKGBUILD). El tarball es el árbol de /usr
# y /etc que arma dist/empaquetar, dentro de morgan-X.Y.Z-x86_64/. A mano (workflow_dispatch),
# sobre una etiqueta que ya existe: gh workflow run release.yml -f etiqueta=vX.Y.Z

name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      etiqueta:
        description: 'Etiqueta ya publicada (vX.Y.Z)'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    env:
      ETIQUETA: ${{ inputs.etiqueta || github.ref_name }}
    steps:
      - name: Dependencias
        # noto-fonts: los tests del motor miden texto, y el contenedor no trae ninguna fuente.
        run: pacman -Syu --noconfirm --needed git rust glib2 wayland libxkbcommon fontconfig noto-fonts libpulse pam hyprland-protocols github-cli

      - uses: actions/checkout@v4
        with:
          ref: ${{ env.ETIQUETA }}

      - name: La etiqueta coincide con Cargo.toml
        run: |
          version=${ETIQUETA#v}
          cargo_version=$(sed -n '/^\[workspace.package\]/,/^\[/s/^version = "\(.*\)"/\1/p' Cargo.toml)
          if [ "$version" != "$cargo_version" ]; then
            echo "La etiqueta dice $version y Cargo.toml, $cargo_version" >&2
            exit 1
          fi
          echo "VERSION=$version" >>"$GITHUB_ENV"

      - name: Tests
        run: cargo test --locked --workspace

      - name: Compilar
        run: cargo build --locked --release -p morgan -p morganctl -p morgan-lock

      - name: Armar el tarball
        run: |
          raiz=morgan-$VERSION-x86_64
          dist/empaquetar "$raiz" target/release
          strip "$raiz"/usr/bin/morgan "$raiz"/usr/bin/morganctl "$raiz"/usr/bin/morgan-lock
          tar --owner=0 --group=0 --sort=name -czf "$raiz.tar.gz" "$raiz"
          sha256sum "$raiz.tar.gz" >"$raiz.tar.gz.sha256"

      - name: Publicar el release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          gh release create "$ETIQUETA" --verify-tag --title "morgan $VERSION" \
            --generate-notes \
            "morgan-$VERSION-x86_64.tar.gz" "morgan-$VERSION-x86_64.tar.gz.sha256"
