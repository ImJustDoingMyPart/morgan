# Gruvbox Material (fondo medium, paleta "material"). Fuente: sainnhe/gruvbox-material
# (autoload/gruvbox_material.vim). Reemplaza al tema que se llamaba gruvbox-dark-medium y
# decía ser de morhetz/gruvbox: sus colores eran estos (#d4be98, #ea6962…), mezclados con
# algunos de morhetz. Vocabulario y reglas: crates/morgan-temas/src/paleta.rs.
#
# La terminal es la que ya tenía el tema (portada de su alacritty.toml), no la de
# kitty-themes, que difiere en color0 (#665c54) y color3 (#e78a4e, el naranja).

bg0 = "#1b1b1b"  # bg_dim
bg1 = "#1d2021"  # bg0 de la variante hard
bg  = "#282828"  # bg0
bg2 = "#32302f"  # bg1
bg3 = "#45403d"  # bg3
bg4 = "#5a524c"  # bg5

text   = "#d4be98"  # fg0
text2  = "#a89984"  # grey2
muted = "#928374"  # grey1

primary   = "#7daea3"  # blue
secondary = "#d8a657"  # yellow
tertiary  = "#d3869b"  # purple

red     = "#ea6962"
yellow = "#d8a657"
green    = "#a9b665"

terminal = [
  "#3c3836", "#ea6962", "#a9b665", "#d8a657", "#7daea3", "#d3869b", "#89b482", "#d4be98",
  "#928374", "#ea6962", "#a9b665", "#d8a657", "#7daea3", "#d3869b", "#89b482", "#d4be98",
]
