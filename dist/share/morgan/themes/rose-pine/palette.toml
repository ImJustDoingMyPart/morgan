# Rosé Pine (variante main). Fuente: rose-pine/palette (palette.json, "main") y, para la
# terminal y los realces (highlight med #403d52), kovidgoyal/kitty-themes (rose-pine.conf).
# Vocabulario y reglas: crates/morgan-temas/src/paleta.rs.
#
# base es el fondo más oscuro de Rosé Pine: los dos primeros escalones son el mismo.

bg0 = "#191724"  # base
bg1 = "#191724"  # base
bg  = "#191724"  # base
bg2 = "#1f1d2e"  # surface
bg3 = "#26233a"  # overlay
bg4 = "#403d52"  # highlight med

text   = "#e0def4"  # text
text2  = "#908caa"  # subtle
muted = "#6e6a86"  # muted

primary   = "#c4a7e7"  # iris
secondary = "#9ccfd8"  # foam
tertiary  = "#ebbcba"  # rose

red     = "#eb6f92"  # love
yellow = "#f6c177"  # gold
green    = "#31748f"  # pine (Rosé Pine no tiene verde: pine es el que usa su terminal)

terminal = [
  "#26233a", "#eb6f92", "#31748f", "#f6c177", "#9ccfd8", "#c4a7e7", "#ebbcba", "#e0def4",
  "#6e6a86", "#eb6f92", "#31748f", "#f6c177", "#9ccfd8", "#c4a7e7", "#ebbcba", "#e0def4",
]
