# Dracula. Fuente: dracula/visual-studio-code (src/dracula.yml: la paleta y los fondos
# BGDarker…BGLighter) y, para la terminal, kovidgoyal/kitty-themes (Dracula.conf).
# Vocabulario y reglas: crates/morgan-temas/src/paleta.rs.

fondo0 = "#191a21"  # BGDarker
fondo1 = "#21222c"  # BGDark
fondo  = "#282a36"  # Background
fondo2 = "#343746"  # BGLight
fondo3 = "#424450"  # BGLighter
fondo4 = "#44475a"  # Selection

texto   = "#f8f8f2"                      # Foreground
texto2  = ["#f8f8f2", "#6272a4", 0.6]    # Dracula no tiene un texto secundario: entre los dos
apagado = "#6272a4"                      # Comment

primario   = "#bd93f9"  # Purple
secundario = "#ff79c6"  # Pink
terciario  = "#8be9fd"  # Cyan

rojo     = "#ff5555"
amarillo = "#f1fa8c"
verde    = "#50fa7b"

terminal = [
  "#21222c", "#ff5555", "#50fa7b", "#f1fa8c", "#bd93f9", "#ff79c6", "#8be9fd", "#f8f8f2",
  "#6272a4", "#ff6e6e", "#69ff94", "#ffffa5", "#d6acff", "#ff92df", "#a4ffff", "#ffffff",
]
