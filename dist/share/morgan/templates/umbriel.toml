# Plantilla del motor de temas de morgan -> ~/.local/state/morgan/tema/umbriel.toml
# La incluye ~/.config/umbriel/morgan.toml (la escribe morgan). Umbriel pinta el borde liso:
# el degradé de primary a secondary lo dibuja el efecto de morgan (umbriel_borde.glsl) sobre el
# anillo de la ventana con foco, que tiene que ser opaco; el resto, transparente, como en
# Hyprland.

[colors]
background = "#{{colors.surface_container.default.hex_stripped}}FF"
text_primary = "#{{colors.on_surface.default.hex_stripped}}FF"
text_muted = "#{{colors.on_surface_variant.default.hex_stripped}}FF"
accent_primary = "#{{colors.primary.default.hex_stripped}}FF"
accent_secondary = "#{{colors.tertiary.default.hex_stripped}}FF"
warning = "#{{colors.tertiary.default.hex_stripped}}FF"
error = "#{{colors.error.default.hex_stripped}}FF"
insert_hint = "#{{colors.primary.default.hex_stripped}}80"
shadow = "#0000007F"

[colors.border]
focused = "#{{colors.primary.default.hex_stripped}}FF"
unfocused = "#00000000"
outer = "#00000000"

# Las teclas de atajo del overview: la tecla va en primary y Umbriel mezcla el 9 % de este
# color sobre background para el fondo del badge (keycapBackgroundColor en src/scene/color.h).
# Sin esta clave queda su default azul, que no sale del tema.
[colors.overview]
badge = "#{{colors.primary.default.hex_stripped}}FF"
