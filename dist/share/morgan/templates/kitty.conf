# Plantilla del motor de temas de morgan -> ~/.local/state/morgan/tema/kitty.conf
#
# kitty importa un archivo de tema aparte con `include ./themes/theme.conf`: morgan mueve
# ese symlink y kitty.conf no se entera.
#
# Los 16 colores ANSI vienen de term0..15, que arma el motor de temas (morgan-temas,
# paleta.rs): en un tema curado son la paleta de terminal del tema; en el generado, roles
# de Material 3 (M3 no tiene "rojo" ni "verde": van los roles de contraste parecido).
#
# Sin placeholders dentro de comentarios: el motor de matugen no los distingue.

background {{colors.surface.default.hex}}
foreground {{colors.on_surface.default.hex}}

cursor            {{colors.on_surface.default.hex}}
cursor_text_color {{colors.surface.default.hex}}

selection_foreground {{colors.on_surface.default.hex}}
selection_background {{colors.surface_container_highest.default.hex}}

url_color {{colors.primary.default.hex}}

color0 {{colors.term0.default.hex}}
color1 {{colors.term1.default.hex}}
color2 {{colors.term2.default.hex}}
color3 {{colors.term3.default.hex}}
color4 {{colors.term4.default.hex}}
color5 {{colors.term5.default.hex}}
color6 {{colors.term6.default.hex}}
color7 {{colors.term7.default.hex}}

color8  {{colors.term8.default.hex}}
color9  {{colors.term9.default.hex}}
color10 {{colors.term10.default.hex}}
color11 {{colors.term11.default.hex}}
color12 {{colors.term12.default.hex}}
color13 {{colors.term13.default.hex}}
color14 {{colors.term14.default.hex}}
color15 {{colors.term15.default.hex}}
