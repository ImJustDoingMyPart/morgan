[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.1"
edition = "2024"
publish = false
license = "GPL-3.0-or-later"

[workspace.dependencies]
morgan-ipc = { path = "crates/morgan-ipc" }
morgan-idioma = { path = "crates/morgan-idioma" }
morgan-temas = { path = "crates/morgan-temas" }
morgan-motor = { path = "crates/morgan-motor" }
smithay-client-toolkit = { version = "0.21", default-features = false, features = ["calloop"] }
gtk = { package = "gtk4", version = "0.11", features = ["v4_22"] }
gtk4-layer-shell = { version = "0.8", features = ["v1_3"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
async-channel = "2"
toml = "1"
toml_edit = "0.25"
libpulse-binding = "2"
libpulse-glib-binding = "2"
zbus = "5"
futures-lite = "2"
gio-unix = "0.22"
glib-unix = "0.22"
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client", "staging"] }
wayland-protocols-wlr = { version = "0.3", features = ["client"] }
wayland-scanner = "0.31"
wayland-backend = "0.3"
bitflags = "2"
udev = "0.9"
libc = "0.2"
rrule = "0.14"
chrono = "0.4"
chrono-tz = "0.10"
